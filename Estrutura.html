<!DOCTYPE html> <!-- Define a Versão do HTML -->
<html lang="en"> <!-- Define o idioma da página -->
<head> <!-- parte nao visivel do site, configuração do site -->
    <meta charset="UTF-8"> <!-- Define a codificação de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Define a largura da página e a escala inicial que otimiza tanto para computadores quanto para celulares -->
    <title> My Site Boladon </title>
</head>
<body> <!-- parte visível do site -->
    <h1> My Title </h1>
    <p> My Paragraph </p>
    <button> My Button </button>
    <input type="text" placeholder="My Input"> <!-- input de texto, caixa de texto -->
</body>
</html>
